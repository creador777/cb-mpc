name: fuzz-farm-cbmpc

# ============================================================================
#  GRANJA 24/7 — cb-mpc (Coinbase) para bug bounty HackerOne.
#  18 maquinas en paralelo (6 shards x 3 harnesses) ~= 72 nucleos.
#   - cada shard con SEMILLA distinta -> exploran caminos diferentes (no clones).
#   - corpus cacheado por shard -> NO se pierde lo aprendido entre runs.
#   - fuzztime 4h < cron 6h -> los runs COMPLETAN y guardan el corpus aunque
#     el cron de GitHub llegue tarde (clave: antes se cortaban y no persistian).
#   - concurrency cancel-in-progress -> nunca se apila.
#   - clasificacion: DoS is_in_range (Low, conocido) NO alerta;
#     forgery/nonce-reuse/key-leak/memoria (ALTO VALOR $15K-$50K) -> email.
#   - crash cifrado con GPG si existe el secret GPG_PUBLIC_KEY.
#  Build replicado del Dockerfile del repo: clang-20 + OpenSSL 3.6.1 estatico.
# ============================================================================

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: fuzz-farm-cbmpc
  # NO cancelar el run en curso. Medido 2026-07-25: con cancel-in-progress:true los
  # 10 ultimos runs murieron CANCELADOS, cada uno justo al nacer el siguiente (uno
  # llevaba 393 min). La cuenta: cola (~3.6h) + build (~0.5h) + fuzz (4h) = ~8h > cron 6h,
  # asi que el cron siguiente SIEMPRE lo mataba antes de terminar -> nunca completaba,
  # nunca publicaba corpus al pool, nunca alertaba. Bucle infinito que se sostiene solo.
  # Con false el run nuevo ESPERA (GitHub mantiene 1 corriendo + 1 pendiente como mucho,
  # asi que tampoco se apila).
  cancel-in-progress: false

permissions:
  contents: write   # write -> publicar corpus aprendido al pool compartido (enjambre)

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        harness:
          - { bin: fuzz_malicious,    build: build_fuzz_malicious.sh, corpus: corpus }
          - { bin: fuzz_malicious_mp, build: build_fuzz_malicious.sh, corpus: corpus_mp }
          - { bin: fuzz_schnorr,      build: build_fuzz_schnorr.sh,   corpus: corpus_schnorr }
          - { bin: fuzz_tdh2,         build: build_fuzz_tdh2.sh,      corpus: corpus_tdh2 }   # threshold decryption
          - { bin: fuzz_pve,          build: build_fuzz_pve.sh,       corpus: corpus_pve }    # NUEVO: PVE (backup/recovery de claves) - superficie FRESCA
        shard: [1, 2, 3]   # 5 harnesses x 3 shards = 15 jobs (~60 nucleos). Baje 4->3 shards al sumar PVE:
                           # 20 jobs saturaba la cuota y encolaba todo. Vale mas 1 target NUEVO que 1 shard extra
                           # sobre terreno ya agotado (ecdsa/schnorr en meseta).
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      FUZZTIME: '14400'   # 4h; < cron 6h -> el run completa y guarda corpus aun con cron tardio
    steps:
      - uses: actions/checkout@v4

      - name: Preflight de retencion cifrada
        id: retention_preflight
        run: |
          set -euo pipefail

          if [ -z "${GPG_PUBLIC_KEY:-}" ]; then
            echo "::error::GPG_PUBLIC_KEY ausente. NO RETENTION = NO HUNT."
            exit 1
          fi

          GH="$(mktemp -d)"
          PUB="$(mktemp)"
          CANARY="$(mktemp)"
          ENC="$(mktemp)"

          cleanup() {
            rm -rf "$GH" "$PUB" "$CANARY" "$ENC"
          }
          trap cleanup EXIT

          chmod 700 "$GH"
          printf '%s' "$GPG_PUBLIC_KEY" > "$PUB"

          GNUPGHOME="$GH" \
            gpg --batch --import "$PUB" >/dev/null 2>&1

          FPR=$(
            GNUPGHOME="$GH" \
              gpg --batch --with-colons --list-keys |
              awk -F: '$1=="fpr"{print $10; exit}'
          )

          if [ -z "$FPR" ]; then
            echo "::error::La clave publica GPG no pudo importarse."
            exit 1
          fi

          printf 'CBMPC-RETENTION-CANARY\n' > "$CANARY"

          GNUPGHOME="$GH" \
            gpg --batch --yes \
              --trust-model always \
              --recipient "$FPR" \
              --output "$ENC" \
              --encrypt "$CANARY"

          test -s "$ENC" || {
            echo "::error::El canary GPG no produjo ciphertext."
            exit 1
          }

          echo "fingerprint=$FPR" >> "$GITHUB_OUTPUT"
          echo "RETENTION_PREFLIGHT=PASS"


      - name: Instalar LLVM 20 + deps (igual que el Dockerfile)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev cmake rsync wget gnupg ca-certificates lsb-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-20 lld-20 llvm-20 libfuzzer-20-dev libclang-rt-20-dev

      - name: Cache OpenSSL 3.6.1 estatico
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /usr/local/opt/openssl@3.6.1
          key: openssl-3.6.1-${{ runner.os }}-clang20-v1

      - name: Build OpenSSL 3.6.1 (si no esta cacheado)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/opt
          sudo chown -R "$USER" /usr/local/opt
          workdir="$(mktemp -d)"
          cp scripts/openssl/build-static-openssl-linux.sh "$workdir/"
          ( cd "$workdir" && CC=clang-20 CXX=clang++-20 sh build-static-openssl-linux.sh )

      - name: Restaurar corpus por shard (persiste lo APRENDIDO entre runs)
        uses: actions/cache@v4
        with:
          path: fuzz/${{ matrix.harness.corpus }}
          key: cbmpc-corpus-${{ matrix.harness.bin }}-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            cbmpc-corpus-${{ matrix.harness.bin }}-s${{ matrix.shard }}-

      - name: Sembrar corpus desde el POOL (cerebro compartido del enjambre)
        run: |
          set +e
          git clone --depth 1 --branch corpus-pool --single-branch \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pool 2>/dev/null
          mkdir -p "fuzz/${{ matrix.harness.corpus }}"
          if [ -d "/tmp/pool/${{ matrix.harness.bin }}" ]; then
            rsync -a --ignore-existing "/tmp/pool/${{ matrix.harness.bin }}/" "fuzz/${{ matrix.harness.corpus }}/"
            echo "sembrados desde el pool: $(find /tmp/pool/${{ matrix.harness.bin }} -type f ! -name '.gitkeep' | wc -l) inputs"
          fi
          rm -rf /tmp/pool
          true

      - name: Compilar fuzzer + FUZZ
        id: fuzz
        env:
          CC: clang-20
          CXX: clang++-20
          CBMPC_OPENSSL_ROOT: /usr/local/opt/openssl@3.6.1
        run: |
          set +e
          bash "fuzz/${{ matrix.harness.build }}"
          brc=$?
          if [ "$brc" != "0" ]; then echo "BUILD FAILED rc=$brc"; echo "rc=200" >> "$GITHUB_OUTPUT"; exit 0; fi
          cd fuzz
          mkdir -p "${{ matrix.harness.corpus }}"
          # semilla distinta por shard -> cada maquina explora un camino diferente
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:symbolize=1:handle_abort=1:handle_segv=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./"${{ matrix.harness.bin }}" -fork=2 -ignore_crashes=1 -rss_limit_mb=4096 -timeout=25 \
            -seed=${{ matrix.shard }} -max_total_time="${FUZZTIME}" -artifact_prefix=hit_ "${{ matrix.harness.corpus }}" > fuzz.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "----- tail fuzz.log -----"; tail -n 25 fuzz.log || true

      - name: Publicar corpus aprendido al POOL (retry anti-colision)
        if: always() && steps.fuzz.outputs.rc != '200'
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            rm -rf /tmp/pool
            git clone --depth 1 --branch corpus-pool --single-branch \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pool 2>/dev/null || { echo "no pude clonar el pool"; break; }
            mkdir -p "/tmp/pool/${{ matrix.harness.bin }}"
            rsync -a --ignore-existing "fuzz/${{ matrix.harness.corpus }}/" "/tmp/pool/${{ matrix.harness.bin }}/"
            # NUNCA subir crashes crudos al pool publico (solo inputs de corpus).
            # Antes solo se borraban hit_* y crash-*: quedaban fuera sl_*, uaf_*,
            # timeout-*, oom-*, leak-* y slow-unit-*, todos prefijos que producen
            # nuestras herramientas. Un PoC sin reportar publicado en una rama
            # publica quema el bounty, asi que la red se cierra por completo y se
            # verifica DESPUES de limpiar, fallando el paso si algo sobrevivio.
            P="/tmp/pool/${{ matrix.harness.bin }}"
            rm -f "$P"/hit_* "$P"/crash-* "$P"/sl_* "$P"/uaf_* "$P"/diag_* \
                  "$P"/timeout-* "$P"/oom-* "$P"/leak-* "$P"/slow-unit-* \
                  "$P"/*crash* "$P"/*.log 2>/dev/null
            SOBRA=$(find "$P" -maxdepth 1 \( -name '*crash*' -o -name 'hit_*' -o -name 'sl_*' \
                    -o -name 'uaf_*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) 2>/dev/null | wc -l)
            if [ "$SOBRA" != "0" ]; then
              echo "::error::ABORTO: $SOBRA artefacto(s) de crash iban al pool PUBLICO"
              cd "$GITHUB_WORKSPACE"; break
            fi
            cd /tmp/pool
            git config user.email "bot@fuzz"; git config user.name "cloud-${{ matrix.harness.bin }}-s${{ matrix.shard }}"
            git add -A
            if git diff --cached --quiet; then echo "sin aportes nuevos al pool"; cd "$GITHUB_WORKSPACE"; break; fi
            n=$(git diff --cached --name-only | wc -l)
            git commit -q -m "cloud ${{ matrix.harness.bin }} s${{ matrix.shard }}: +$n inputs al pool"
            if git push origin corpus-pool 2>/dev/null; then echo "publicados $n inputs al pool (intento $attempt)"; cd "$GITHUB_WORKSPACE"; break; fi
            echo "colision de push, reintento $attempt..."; cd "$GITHUB_WORKSPACE"; sleep $((RANDOM % 8 + 3))
          done
          true

      - name: Clasificar incidente y decidir captura
        id: classify
        if: always() && steps.fuzz.outputs.rc != '200'
        run: |
          set +e
          cd fuzz

          NEW=0

          if grep -aE \
            'CRITICAL \[[A-Za-z0-9_-]+\]' \
            fuzz.log 2>/dev/null |
            grep -av 'is_in_range' >/dev/null 2>&1
          then
            NEW=1
          fi

          if grep -aE \
            'SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer|MemorySanitizer): (heap-buffer-overflow|heap-use-after-free|use-after-free|stack-buffer-overflow|global-buffer-overflow|double-free|stack-overflow|SEGV|out-of-bounds)' \
            fuzz.log 2>/dev/null |
            grep -av 'is_in_range' >/dev/null 2>&1
          then
            NEW=1
          fi

          LAST=$(
            grep -aE '^#[0-9]+.*cov:' \
              fuzz.log 2>/dev/null |
              tail -1
          )

          NOOM=$(
            printf '%s' "$LAST" |
              sed -nE \
                's#.*oom/timeout/crash: ([0-9]+)/[0-9]+/[0-9]+.*#\1#p'
          )
          NOOM=${NOOM:-0}

          NTIMEOUT=$(
            printf '%s' "$LAST" |
              sed -nE \
                's#.*oom/timeout/crash: [0-9]+/([0-9]+)/[0-9]+.*#\1#p'
          )
          NTIMEOUT=${NTIMEOUT:-0}

          NCRASH=$(
            printf '%s' "$LAST" |
              sed -nE \
                's#.*oom/timeout/crash: [0-9]+/[0-9]+/([0-9]+).*#\1#p'
          )
          NCRASH=${NCRASH:-0}

          shopt -s nullglob

          CRASH_FILES=(hit_crash-*)
          TIMEOUT_FILES=(hit_timeout-*)
          OOM_FILES=(hit_oom-*)
          SLOW_FILES=(hit_slow-unit-*)

          NCRASH_FILES=${#CRASH_FILES[@]}
          NTIMEOUT_FILES=${#TIMEOUT_FILES[@]}
          NOOM_FILES=${#OOM_FILES[@]}
          NSLOW_FILES=${#SLOW_FILES[@]}

          CAPTURE=0
          REASONS=()

          if [ "$NEW" = "1" ]; then
            CAPTURE=1
            REASONS+=(high_value)
          fi

          if [ "$NCRASH" -gt 0 ]; then
            CAPTURE=1
            REASONS+=(log_crash)
          fi

          if [ "$NTIMEOUT" -gt 0 ]; then
            CAPTURE=1
            REASONS+=(log_timeout)
          fi

          if [ "$NOOM" -gt 0 ]; then
            CAPTURE=1
            REASONS+=(log_oom)
          fi

          if [ "$NCRASH_FILES" -gt 0 ]; then
            CAPTURE=1
            REASONS+=(physical_crash)
          fi

          if [ "$NTIMEOUT_FILES" -gt 0 ]; then
            CAPTURE=1
            REASONS+=(physical_timeout)
          fi

          if [ "$NOOM_FILES" -gt 0 ]; then
            CAPTURE=1
            REASONS+=(physical_oom)
          fi

          if [ "${#REASONS[@]}" -eq 0 ]; then
            REASON="none"
          else
            REASON=$(
              IFS=,
              printf '%s' "${REASONS[*]}"
            )
          fi

          {
            echo "new=$NEW"
            echo "capture=$CAPTURE"
            echo "capture_reason=$REASON"

            echo "ncrash=$NCRASH"
            echo "ntimeout=$NTIMEOUT"
            echo "noom=$NOOM"

            echo "ncrash_files=$NCRASH_FILES"
            echo "ntimeout_files=$NTIMEOUT_FILES"
            echo "noom_files=$NOOM_FILES"
            echo "nslow_files=$NSLOW_FILES"
          } >> "$GITHUB_OUTPUT"

          echo \
            "INCIDENT_COUNTS crashes=$NCRASH/$NCRASH_FILES timeouts=$NTIMEOUT/$NTIMEOUT_FILES oom=$NOOM/$NOOM_FILES capture=$CAPTURE reason=$REASON"

      - name: Construir y cifrar capsula del incidente
        id: encrypt_incident
        if: always() && steps.classify.outputs.capture == '1'
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "ok=false" >> "$GITHUB_OUTPUT"

          cd fuzz
          shopt -s nullglob

          if [ -z "${GPG_PUBLIC_KEY:-}" ]; then
            echo "::error::Incidente detectado sin GPG_PUBLIC_KEY."
            exit 20
          fi

          test -f fuzz.log || : > fuzz.log

          GH="$(mktemp -d)"
          PUB="$(mktemp)"

          cleanup() {
            rm -rf "$GH" "$PUB" incident.tgz pub.asc
          }
          trap cleanup EXIT

          chmod 700 "$GH"
          printf '%s' "$GPG_PUBLIC_KEY" > "$PUB"

          GNUPGHOME="$GH" \
            gpg --batch --import "$PUB" >/dev/null 2>&1

          FPR=$(
            GNUPGHOME="$GH" \
              gpg --batch --with-colons --list-keys |
              awk -F: '$1=="fpr"{print $10; exit}'
          )

          test -n "$FPR"

          ENC="incident_${{ matrix.harness.bin }}_s${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}.tgz.gpg"

          {
            echo "schema_version=1"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "commit=${{ github.sha }}"
            echo "harness=${{ matrix.harness.bin }}"
            echo "shard=${{ matrix.shard }}"
            echo "seed=${{ matrix.shard }}"
            echo "fecha_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            echo "capture_reason=${{ steps.classify.outputs.capture_reason }}"
            echo "alto_valor=${{ steps.classify.outputs.new }}"

            echo "log_crashes=${{ steps.classify.outputs.ncrash }}"
            echo "log_timeouts=${{ steps.classify.outputs.ntimeout }}"
            echo "log_oom=${{ steps.classify.outputs.noom }}"

            echo "physical_crashes=${{ steps.classify.outputs.ncrash_files }}"
            echo "physical_timeouts=${{ steps.classify.outputs.ntimeout_files }}"
            echo "physical_oom=${{ steps.classify.outputs.noom_files }}"

            echo "clang=$(clang-20 --version | head -1)"
            echo "openssl=$(openssl version)"
            echo "asan_options=${ASAN_OPTIONS:-}"
            echo "ubsan_options=${UBSAN_OPTIONS:-}"
          } > incident_manifest.txt

          : > incident_hashes.txt

          BUNDLE=(
            fuzz.log
            incident_manifest.txt
            incident_hashes.txt
          )

          CRASH_FILES=(hit_crash-*)
          OOM_FILES=(hit_oom-*)
          TIMEOUT_FILES=(hit_timeout-*)

          for f in "${CRASH_FILES[@]}"; do
            BUNDLE+=("$f")
            printf 'crash %s %s\n' \
              "$(sha256sum "$f" | awk '{print $1}')" \
              "$f" >> incident_hashes.txt
          done

          for f in "${OOM_FILES[@]}"; do
            BUNDLE+=("$f")
            printf 'oom %s %s\n' \
              "$(sha256sum "$f" | awk '{print $1}')" \
              "$f" >> incident_hashes.txt
          done

          if [ "${#TIMEOUT_FILES[@]}" -gt 0 ]; then
            for f in "${TIMEOUT_FILES[@]}"; do
              BUNDLE+=("$f")
              printf 'timeout %s %s\n' \
                "$(sha256sum "$f" | awk '{print $1}')" \
                "$f" >> incident_hashes.txt
            done

          elif [ "${{ steps.classify.outputs.ntimeout }}" != "0" ]; then
            SLOW_FILES=(hit_slow-unit-*)

            for f in "${SLOW_FILES[@]}"; do
              BUNDLE+=("$f")
              printf 'slow-unit-as-timeout %s %s\n' \
                "$(sha256sum "$f" | awk '{print $1}')" \
                "$f" >> incident_hashes.txt
            done
          fi

          tar -czf incident.tgz "${BUNDLE[@]}"

          GNUPGHOME="$GH" \
            gpg --batch --yes \
              --trust-model always \
              --recipient "$FPR" \
              --output "$ENC" \
              --encrypt incident.tgz

          test -s "$ENC"

          sha256sum "$ENC" > "$ENC.sha256"


          {
            echo "ok=true"
            echo "file=$ENC"
            echo "sha256=$(sha256sum "$ENC" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

          echo "ENCRYPTION=PASS file=$ENC"

      - name: Subir capsula cifrada
        id: upload_incident
        if: always() && steps.encrypt_incident.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: INCIDENT-ENCRYPTED-${{ matrix.harness.bin }}-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/${{ steps.encrypt_incident.outputs.file }}
            fuzz/${{ steps.encrypt_incident.outputs.file }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Fallback cifrado al pool si falla artifact
        id: encrypted_pool
        if: always() && steps.encrypt_incident.outputs.ok == 'true' && steps.upload_incident.outcome != 'success'
        continue-on-error: true
        run: |
          set +e

          echo "ok=false" >> "$GITHUB_OUTPUT"

          SRC="${{ github.workspace }}/fuzz/${{ steps.encrypt_incident.outputs.file }}"
          SHAFILE="$SRC.sha256"

          test -s "$SRC" || exit 1
          test -s "$SHAFILE" || exit 1

          for attempt in 1 2 3 4 5 6; do
            rm -rf /tmp/poolv

            git clone \
              --depth 1 \
              --branch corpus-pool \
              --single-branch \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              /tmp/poolv 2>/dev/null || {
                sleep $((RANDOM % 7 + 2))
                continue
              }

            REL="encrypted-incidents/${{ github.run_id }}/${{ matrix.harness.bin }}-s${{ matrix.shard }}"
            DEST="/tmp/poolv/$REL"

            mkdir -p "$DEST"

            cp -- "$SRC" "$DEST/"
            cp -- "$SHAFILE" "$DEST/"

            cd /tmp/poolv

            git config user.email "bot@fuzz"
            git config user.name "encrypted-retention"

            git add -- "$REL"

            if git diff --cached --quiet; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "FALLBACK_ALREADY_PRESENT=YES"
              exit 0
            fi

            git commit -q \
              -m "encrypted incident ${{ github.run_id }} ${{ matrix.harness.bin }} s${{ matrix.shard }}"

            if git push origin corpus-pool 2>/dev/null; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "FALLBACK_ENCRYPTED_POOL=PASS"
              exit 0
            fi

            cd "$GITHUB_WORKSPACE"
            sleep $((RANDOM % 7 + 2))
          done

          echo "FALLBACK_ENCRYPTED_POOL=FAIL"
          exit 1

      - name: Verificar retencion durable
        id: retention
        if: always() && steps.classify.outputs.capture == '1'
        run: |
          ENC="${{ steps.encrypt_incident.outputs.ok }}"
          UPLOAD="${{ steps.upload_incident.outcome }}"
          FALLBACK="${{ steps.encrypted_pool.outputs.ok }}"

          echo "encrypt=$ENC"
          echo "upload=$UPLOAD"
          echo "fallback=$FALLBACK"

          if [ "$ENC" != "true" ]; then
            echo "status=encryption_failed" >> "$GITHUB_OUTPUT"
            echo "::error::Incidente detectado, pero el cifrado fallo."
            exit 1
          fi

          if [ "$UPLOAD" = "success" ]; then
            echo "status=artifact_secured" >> "$GITHUB_OUTPUT"
            echo "RETENTION=PASS destination=artifact"
            exit 0
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "status=fallback_secured" >> "$GITHUB_OUTPUT"
            echo "::warning::Artifact fallo; ciphertext preservado en fallback."
            echo "RETENTION=DEGRADED destination=encrypted_pool"
            exit 1
          fi

          echo "status=retention_failed" >> "$GITHUB_OUTPUT"
          echo "::error::Incidente detectado sin ninguna copia durable."
          exit 1

      - name: Crear metadata segura del incidente
        if: always() && steps.classify.outputs.capture == '1'
        env:
          CORPUS_POOL_TOKEN: ${{ secrets.CORPUS_POOL_TOKEN }}
        run: |
          set +e
          cd fuzz

          FAMILY=$(
            grep -aoE \
              'heap-use-after-free|use-after-free|heap-buffer-overflow|stack-buffer-overflow|global-buffer-overflow|double-free|stack-overflow|SEGV|out-of-bounds|ABRT|DEADLYSIGNAL' \
              fuzz.log 2>/dev/null |
              head -1
          )

          case "$FAMILY" in
            *use-after-free)
              FAMILY="UAF"
              ;;
            *buffer-overflow|out-of-bounds)
              FAMILY="BUFFER_OVERFLOW"
              ;;
            double-free)
              FAMILY="DOUBLE_FREE"
              ;;
            stack-overflow)
              FAMILY="STACK_OVERFLOW"
              ;;
            SEGV)
              FAMILY="SEGV"
              ;;
            ABRT|DEADLYSIGNAL)
              FAMILY="ABRT"
              ;;
            *)
              FAMILY="UNKNOWN"
              ;;
          esac

          {
            echo "harness=${{ matrix.harness.bin }}"
            echo "shard=${{ matrix.shard }}"
            echo "run=${{ github.run_id }}"
            echo "fecha_utc=$(date -u +%Y%m%dT%H%M%SZ)"

            echo "crashes=${{ steps.classify.outputs.ncrash }}"
            echo "timeouts=${{ steps.classify.outputs.ntimeout }}"
            echo "oom=${{ steps.classify.outputs.noom }}"

            echo "crash_files=${{ steps.classify.outputs.ncrash_files }}"
            echo "timeout_files=${{ steps.classify.outputs.ntimeout_files }}"
            echo "oom_files=${{ steps.classify.outputs.noom_files }}"

            echo "alto_valor=${{ steps.classify.outputs.new }}"
            echo "capture_reason=${{ steps.classify.outputs.capture_reason }}"
            echo "error_family=$FAMILY"
            echo "retention=${{ steps.retention.outputs.status }}"
          } > resumen_hallazgo.txt

          cat resumen_hallazgo.txt

          # --------------------------------------------------------------
          # 2026-07-29 — LOS HALLAZGOS YA NO VAN A LA RAMA PUBLICA.
          #
          # Son contadores (que harness rompe, con que familia de error, en que
          # run). No llevan input crudo ni stack trace, pero publicados le dan
          # a un competidor el mapa de donde estamos encontrando cosas antes de
          # que reportemos. Los 35 historicos se movieron a un repo PRIVADO.
          #
          # FAIL-OPEN A PROPOSITO: si falta CORPUS_POOL_TOKEN no se publica y
          # NO se rompe el run. La caza no puede depender de un token que
          # expira. El artifact de abajo (90 dias) es el canal de respaldo y
          # el panel ya lo lee. Lo unico prohibido es volver al publico.
          # --------------------------------------------------------------
          if [ -z "${CORPUS_POOL_TOKEN:-}" ]; then
            echo "::notice::CORPUS_POOL_TOKEN ausente; hallazgo solo va por artifact."
            exit 0
          fi

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          SIG="hallazgo_${{ matrix.harness.bin }}_s${{ matrix.shard }}_${STAMP}.txt"

          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/poolh

            git clone \
              --depth 1 \
              --branch corpus-pool \
              --single-branch \
              "https://x-access-token:${CORPUS_POOL_TOKEN}@github.com/creador777/cbmpc-corpus.git" \
              /tmp/poolh 2>/dev/null || break

            mkdir -p /tmp/poolh/hallazgos
            cp resumen_hallazgo.txt "/tmp/poolh/hallazgos/$SIG"

            cd /tmp/poolh

            git config user.email "bot@fuzz"
            git config user.name "safe-metadata"

            git add -- "hallazgos/$SIG"

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -q \
              -m "safe incident metadata ${{ github.run_id }}"

            if git push origin corpus-pool 2>/dev/null; then
              echo "hallazgo publicado al archivo privado"
              exit 0
            fi

            cd "$GITHUB_WORKSPACE/fuzz"
            sleep $((RANDOM % 7 + 2))
          done

          echo "::warning::No se pudo publicar al archivo privado; queda el artifact."
          true

      - name: Subir metadata segura
        if: always() && steps.classify.outputs.capture == '1'
        uses: actions/upload-artifact@v4
        with:
          name: HALLAZGO-${{ matrix.harness.bin }}-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/resumen_hallazgo.txt
          retention-days: 90

      - name: Marcar fallo si HIT (dispara email a tu Gmail)
        if: steps.classify.outputs.new == '1'
        run: |
          echo "HIT ALTO VALOR en ${{ matrix.harness.bin }} shard ${{ matrix.shard }} — revisar artifact."
          exit 1

      - name: Avisar si el build fallo
        if: steps.fuzz.outputs.rc == '200'
        run: |
          echo "El build del fuzzer fallo — revisar logs del step 'Compilar fuzzer + FUZZ'."
          exit 1
